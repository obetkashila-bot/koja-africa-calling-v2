name: KOJA AFRICA - Repair Android Structure and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT THE CURRENT KOJA AFRICA REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout KOJA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. JAVA 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. ANDROID SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 4. REPAIR THE ANDROID PROJECT STRUCTURE
      # ---------------------------------------------------------
      - name: Repair Android project structure
        shell: bash
        run: |
          set -e

          echo "Creating standard Android project directories..."

          mkdir -p android/app/src/main/java/Com/KOJA
          mkdir -p android/app/src/main/res/values

          # -----------------------------------------------------
          # Copy existing root Gradle files if they exist
          # -----------------------------------------------------
          for f in build.gradle.kts settings.gradle.kts gradle.properties; do
            if [ -f "$f" ]; then
              cp -f "$f" "android/$f"
            fi
          done

          # -----------------------------------------------------
          # AndroidManifest
          # -----------------------------------------------------
          if [ -f AndroidManifest.xml ]; then
            cp -f AndroidManifest.xml \
              android/app/src/main/AndroidManifest.xml
          fi

          # -----------------------------------------------------
          # Java source files
          # -----------------------------------------------------
          for f in MainActivity.java IncomingCallActivity.java KOJAFirebaseMessagingService.java; do
            if [ -f "$f" ]; then
              cp -f "$f" \
                "android/app/src/main/java/Com/KOJA/$f"
            fi
          done

          # -----------------------------------------------------
          # Android resources
          # -----------------------------------------------------
          for f in strings.xml styles.xml; do
            if [ -f "$f" ]; then
              cp -f "$f" \
                "android/app/src/main/res/values/$f"
            fi
          done

          # -----------------------------------------------------
          # Firebase Android configuration
          # -----------------------------------------------------
          if [ -f google-services.json ]; then
            cp -f google-services.json \
              android/app/google-services.json
          fi

          # -----------------------------------------------------
          # Correct Android root Gradle configuration
          # -----------------------------------------------------
          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("com.google.gms.google-services") version "4.5.0" apply false
          }
          EOF

          # -----------------------------------------------------
          # Correct settings.gradle.kts
          # -----------------------------------------------------
          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KOJA"
          include(":app")
          EOF

          # -----------------------------------------------------
          # Correct application Gradle configuration
          # -----------------------------------------------------
          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "Com.KOJA"

              compileSdk = 36

              defaultConfig {
                  applicationId = "Com.KOJA"

                  minSdk = 23
                  targetSdk = 35

                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.18.0"))

              implementation("com.google.firebase:firebase-messaging")

              implementation("androidx.core:core:1.17.0")

              implementation("androidx.appcompat:appcompat:1.7.1")
          }
          EOF

          # -----------------------------------------------------
          # Normalize Java package names
          # -----------------------------------------------------
          for f in android/app/src/main/java/Com/KOJA/*.java; do
            [ -f "$f" ] || continue

            sed -i \
              's/^package com\.kojaafrica\.app;/package Com.KOJA;/' \
              "$f"

            sed -i \
              's/^package com\.kojaafrica;/package Com.KOJA;/' \
              "$f"
          done

          # -----------------------------------------------------
          # Verify required files exist
          # -----------------------------------------------------
          echo "Checking repaired Android project..."

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml

          test -f android/app/src/main/java/Com/KOJA/MainActivity.java
          test -f android/app/src/main/java/Com/KOJA/IncomingCallActivity.java
          test -f android/app/src/main/java/Com/KOJA/KOJAFirebaseMessagingService.java

          echo "Android project structure repaired successfully."

      # ---------------------------------------------------------
      # 5. GRADLE 9.5.0
      # AGP 9.3.0 requires Gradle 9.5+
      # ---------------------------------------------------------
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # ---------------------------------------------------------
      # 6. BUILD APK
      # ---------------------------------------------------------
      - name: Build KOJA debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      # ---------------------------------------------------------
      # 7. REMOVE OLD ROOT-LEVEL ANDROID DUPLICATES
      # ONLY AFTER SUCCESSFUL BUILD
      # ---------------------------------------------------------
      - name: Save repaired Android project to repository
        shell: bash
        run: |
          set -e

          echo "Cleaning obsolete root-level Android files..."

          git rm -f AndroidManifest.xml \
            MainActivity.java \
            IncomingCallActivity.java \
            KOJAFirebaseMessagingService.java \
            strings.xml \
            styles.xml \
            2>/dev/null || true

          git rm -f build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            2>/dev/null || true

          git rm -f google-services.json \
            2>/dev/null || true

          # Add the repaired Android project
          git add android

          # -----------------------------------------------------
          # Commit only if something actually changed
          # -----------------------------------------------------
          if git diff --cached --quiet; then

            echo "No repository structure changes to commit."

          else

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit \
              -m "Repair KOJA Android project structure"

            git push

          fi

      # ---------------------------------------------------------
      # 8. UPLOAD THE APK TO GITHUB ACTIONS
      # ---------------------------------------------------------
      - name: Upload KOJA APK
        uses: actions/upload-artifact@v4
        with:
          name: KOJA-AFRICA-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
